version: "3.9"

# ==================================================================
# SparkProcess — Docker Compose
#
# Services:
#   api        — FastAPI + LangGraph backend
#   ui         — Next.js frontend
#   dynamodb   — Local DynamoDB (AgentCore memory, dev only)
#   datadog    — Datadog Agent (local LLM obs collector)
# ==================================================================

services:

  # ----------------------------------------------------------------
  # Backend API
  # ----------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DYNAMODB_ENDPOINT_URL=http://dynamodb:8000
      - API_HOST=0.0.0.0
      - API_PORT=8000
    depends_on:
      - dynamodb
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------
  # Frontend
  # ----------------------------------------------------------------
  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile.ui
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Local DynamoDB (dev/CI only — replace with real AWS DynamoDB in prod)
  # ----------------------------------------------------------------
  dynamodb:
    image: amazon/dynamodb-local:2.5.0
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8001:8000"
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Datadog Agent (sends LLM obs traces to Datadog)
  # Comment out if you don't have a Datadog API key yet
  # ----------------------------------------------------------------
  datadog:
    image: gcr.io/datadoghq/agent:7
    pid: host
    ports:
      - "8126:8126/tcp"
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    restart: unless-stopped
    profiles: ["observability"]

volumes:
  dynamodb_data:
